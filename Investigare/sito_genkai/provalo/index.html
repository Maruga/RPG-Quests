<style>
:root{
  --carta:#f7f4ec; --carta2:#fffdf6; --carta3:#efe9dc;
  --inchiostro:#1c1a17; --inchiostro2:#4a453d; --tenue:#6a655c;
  --rosso:#8b1a1a; --bordo:#d8cfc0; --oro:#b08d2f; --verde:#2e6b30;

  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--carta);color:var(--inchiostro);font-family:var(--serif);font-size:17px;line-height:1.65;-webkit-text-size-adjust:100%}
img{max-width:100%;height:auto;display:block}
a{color:var(--rosso)}
.dentro{max-width:820px;margin:0 auto;padding:0 1.1rem}

.barra{position:sticky;top:0;z-index:50;background:rgba(247,244,236,.96);border-bottom:1px solid var(--bordo);backdrop-filter:blur(6px)}
.barra .dentro{display:flex;align-items:center;gap:.8rem;padding:.5rem 1.1rem}
.marchio{font-family:var(--sans);font-weight:700;letter-spacing:.04em;text-decoration:none;color:var(--inchiostro);font-size:.92rem;white-space:nowrap}
.marchio i{font-style:normal;color:var(--rosso)}
.stato-chip{margin-left:auto;display:flex;gap:.5rem;font-family:var(--sans);font-size:.8rem;align-items:center}
.chip{border:1px solid var(--bordo);background:#fff;border-radius:999px;padding:.15rem .65rem;white-space:nowrap}
.chip b{color:var(--rosso)}
.chip.genkai{border-color:var(--rosso);color:var(--rosso);font-weight:700}
.barra a.torna{font-family:var(--sans);font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--inchiostro2);text-decoration:none;white-space:nowrap}
@media(max-width:560px){ .barra a.torna{display:none} }

main{padding:1.4rem 0 3rem}

/* card scena */
.scena{background:var(--carta2);border:1px solid var(--bordo);border-radius:12px;overflow:hidden}
.scena > img{width:100%}
.scena-corpo{padding:1.1rem 1.2rem 1.4rem}
.tappe{display:flex;gap:.3rem;margin:0 0 .6rem}
.tappe span{width:14px;height:14px;border-radius:50%;border:1px solid var(--bordo);background:#fff}
.tappe span.fatta{background:var(--carta3);border-color:var(--tenue)}
.tappe span.qui{background:var(--rosso);border-color:var(--rosso)}
.scena-tag{font-family:var(--sans);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--rosso);margin:0 0 .3rem}
h1{font-size:clamp(1.5rem,5vw,2.1rem);margin:0 0 .8rem;font-weight:400}
h2{font-size:clamp(1.25rem,4vw,1.55rem);margin:0 0 .8rem;font-weight:400}
.scena p{margin:0 0 .9rem;color:var(--inchiostro2)}
.filosofia{font-style:italic;color:var(--inchiostro2);border-top:1px solid var(--bordo);border-bottom:1px solid var(--bordo);padding:.8rem .4rem;margin:1rem 0;font-size:1rem}
.tu{display:flex;flex-wrap:wrap;gap:.35rem .8rem;font-family:var(--sans);font-size:.8rem;color:var(--tenue);border:1px dashed var(--bordo);border-radius:8px;padding:.55rem .8rem;margin:1rem 0}
.tu b{color:var(--inchiostro)}
.tavolo{font-size:.95rem;background:var(--carta2);border:1px dashed var(--bordo);border-radius:8px;padding:.6rem .8rem;margin:.9rem 0;font-style:italic;color:var(--inchiostro2)}
.tavolo b:first-child{letter-spacing:.06em;text-transform:uppercase;font-size:.72rem;display:block;margin-bottom:.2rem;font-style:normal}

/* scelte */
.scelta{border-top:1px solid var(--bordo);margin-top:1rem;padding-top:1rem}
.scelta-dom{font-family:var(--sans);font-size:.9rem;color:var(--inchiostro);margin:0 0 .7rem;font-weight:600}
.bottoni{display:flex;flex-wrap:wrap;gap:.7rem}
.btn{display:inline-block;font-family:var(--sans);font-size:1rem;padding:.8rem 1.4rem;border-radius:8px;text-decoration:none;border:1px solid var(--inchiostro);color:var(--inchiostro);background:transparent;cursor:pointer;transition:.15s;text-align:left}
.btn small{display:block;font-size:.75rem;color:var(--tenue);margin-top:.15rem}
.btn:hover{background:rgba(28,26,23,.06)}
.btn-forte{background:var(--rosso);border-color:var(--rosso);color:#fff}
.btn-forte small{color:#f3d9d9}
.btn-forte:hover{background:#a02020}
@media(max-width:560px){ .bottoni .btn{width:100%;text-align:center} }

/* tiro in basso */
.tiro-box{border-top:1px solid var(--bordo);margin-top:1.1rem;padding-top:1.1rem}
.tiro-come{font-family:var(--sans);font-size:.85rem;color:var(--tenue);margin:0 0 .9rem}
.tiro-come b{color:var(--inchiostro)}
.dadi{display:flex;gap:.8rem;align-items:center;margin:.9rem 0 .3rem}
.dado{width:58px;height:58px;border:2px solid var(--inchiostro);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-family:var(--sans);font-weight:700;box-shadow:2px 3px 0 rgba(28,26,23,.15)}
.dado.rotola{animation:rotola .09s linear infinite}
@keyframes rotola{50%{transform:rotate(6deg) translateY(-2px)}}
@media(prefers-reduced-motion:reduce){ .dado.rotola{animation:none} }
.somma{font-family:var(--sans);font-size:.92rem;color:var(--inchiostro2);margin:0 0 .9rem}
.somma b{font-size:1.15rem;color:var(--inchiostro)}

/* esito + taccuino affiancati */
.dopo{display:grid;grid-template-columns:1fr;gap:1rem;margin-top:.5rem}
@media(min-width:720px){ .dopo{grid-template-columns:1fr 300px;align-items:start} }
.esito{border-radius:10px;border:1px solid var(--bordo);background:var(--carta);padding:1rem 1.1rem}
.esito h3{margin:0 0 .5rem;font-size:1.02rem;font-family:var(--sans);letter-spacing:.03em}
.esito h3 .fascia{display:inline-block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;padding:.16rem .55rem;border-radius:999px;border:1px solid currentColor;margin-left:.45rem;vertical-align:middle}
.esito.buono h3{color:var(--verde)}
.esito.neutro h3{color:var(--inchiostro2)}
.esito.brutto h3{color:var(--rosso)}
.esito p{margin:.5rem 0;color:var(--inchiostro2)}
.mecc{font-family:var(--sans);font-size:.84rem;background:var(--carta3);border-left:3px solid var(--oro);border-radius:0 6px 6px 0;padding:.6rem .8rem;margin:.7rem 0 0}
.mecc b:first-child,.gm b:first-child{letter-spacing:.06em;text-transform:uppercase;font-size:.7rem;display:block;margin-bottom:.2rem}
.gm{font-family:var(--sans);font-size:.84rem;background:#fdf6f4;border-left:3px solid var(--rosso);border-radius:0 6px 6px 0;padding:.6rem .8rem;margin:.7rem 0 0}
.indizio-card{border:1px solid var(--oro);border-radius:8px;background:#fbf7ec;padding:.7rem .9rem;margin:.8rem 0 0}
.indizio-card h4{margin:0 0 .3rem;font-family:var(--sans);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--oro)}
.indizio-card h4::before{content:"➜ "}
.indizio-card p{margin:0;font-size:.93rem}
.indizio-card img{border-radius:6px;margin:.5rem 0 0}

/* taccuino */
.taccuino{border:1px solid var(--bordo);border-radius:10px;background:#fff;padding:.9rem 1rem;font-family:var(--sans)}
.taccuino h4{margin:0 0 .5rem;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--inchiostro2)}
.taccuino ul{margin:0;padding:0;list-style:none;font-size:.85rem;color:var(--inchiostro2)}
.taccuino li{padding:.3rem 0;border-top:1px dotted var(--bordo)}
.taccuino li:first-child{border-top:0}
.taccuino li.nuova{color:var(--inchiostro);font-weight:600}
.taccuino li::before{content:"✎ ";color:var(--oro)}

.avanti-box{margin-top:1.2rem;display:flex;justify-content:flex-end}
.genkai-riga{font-family:var(--sans);font-size:.85rem;color:var(--rosso);border:1px solid var(--rosso);border-radius:8px;padding:.55rem .8rem;margin-top:.9rem;background:#fdf3f3}

/* finale */
.conto{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.7rem;margin:1rem 0;font-family:var(--sans)}
.conto div{border:1px solid var(--bordo);border-radius:8px;background:#fff;padding:.7rem .8rem;text-align:center}
.conto .num{font-size:1.5rem;font-weight:700}
.conto .lbl{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}
.lezione{border-top:3px double var(--inchiostro);margin-top:1.4rem;padding-top:1rem;font-size:1rem}
.lezione b{color:var(--rosso)}
footer.fine{padding:1.6rem 0 0;text-align:center;font-family:var(--sans);font-size:.85rem;color:var(--tenue)}
[hidden]{display:none!important}
</style>

<script>
(function(){
"use strict";

/* ── lo stato del caso ── */
const S = {
  attr: { "Distacco":6, "Lucidità":7, "Ascolto":6, "Pazienza":5, "Silenzio":5, "Presenza":4 },
  ki: 9, kiMax: 9, nasake: 0, soroban: 0,
  indizi: [], scena: 0, gouUsato: false, esitoScontro: null
};

/* ── il mazzo delle fasce: in tutto il caso escono tutte prima che una si ripeta ── */
const FASCE = ["k2","n3","ok","fl","n11","k12"];
let mazzo = [], ultima = null;
function pesca(){
  if (!mazzo.length){
    mazzo = FASCE.slice();
    for (let i = mazzo.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [mazzo[i],mazzo[j]]=[mazzo[j],mazzo[i]]; }
    if (ultima && mazzo[0]===ultima){ const j = 1+Math.floor(Math.random()*(mazzo.length-1)); [mazzo[0],mazzo[j]]=[mazzo[j],mazzo[0]]; }
  }
  ultima = mazzo.shift();
  return ultima;
}
function dadiPer(fascia, attr){
  let somme;
  if (fascia==="k2") somme=[2];
  else if (fascia==="n3") somme=[3];
  else if (fascia==="n11") somme=[11];
  else if (fascia==="k12") somme=[12];
  else if (fascia==="ok"){ somme=[]; for(let s=4;s<=Math.max(4,attr);s++) somme.push(s); }
  else { somme=[]; for(let s=Math.max(5,attr+1);s<=10;s++) somme.push(s); }
  const s = somme[Math.floor(Math.random()*somme.length)];
  const min = Math.max(1,s-6), max = Math.min(6,s-1);
  const a = min + Math.floor(Math.random()*(max-min+1));
  return [a, s-a];
}

const META = {
  k2:{classe:"buono", fascia:"Kiwami 極 · 2", titolo:"Successo critico"},
  n3:{classe:"buono", fascia:"Nami 波 · 3", titolo:"Successo notevole"},
  ok:{classe:"buono", fascia:"", titolo:"Successo"},
  fl:{classe:"neutro", fascia:"", titolo:"Fallimento leggero"},
  n11:{classe:"brutto", fascia:"Nami 波 · 11", titolo:"Fallimento notevole"},
  k12:{classe:"brutto", fascia:"Kiwami 極 · 12", titolo:"Fallimento critico"}
};

/* meccanica standard dei tiri d'indagine: applica allo stato e spiega */
function applicaMecc(fascia, attr){
  let m = "";
  if (fascia==="k2"){
    S.attr[attr] = Math.min(9, S.attr[attr]+1);
    if (S.ki < S.kiMax){ S.ki++; m = `2 sui dadi nudi: successo critico. <b>+1 a ${attr} e +1 al Ki.</b>`; }
    else { S.nasake = Math.min(1, S.nasake+1); m = `2 sui dadi nudi: successo critico. <b>+1 a ${attr}</b> — e col Ki già pieno, il punto va nel <b>Nasake 情け</b>: lo donerai a un compagno, giocando la scena.`; }
    S.soroban -= 2; m += " <b>Soroban: segna −2.</b>";
  } else if (fascia==="n3"){
    if (S.ki < S.kiMax){ S.ki++; m = "3: notevole. <b>+1 a scelta</b> — qui lo mettiamo sul Ki."; }
    else { S.attr[attr] = Math.min(9, S.attr[attr]+1); m = `3: notevole. <b>+1 a scelta</b> — Ki pieno, quindi su ${attr}.`; }
    S.soroban -= 1; m += " <b>Soroban: segna −1.</b>";
  } else if (fascia==="ok"){
    m = `Somma ≤ ${S.attr[attr]}: successo pieno. Nessun costo.`;
  } else if (fascia==="fl"){
    m = `Somma tra ${S.attr[attr]+1} e 10: fallimento leggero, <b>solo narrativo</b> — nessuna perdita di punti. La scena lo mostra, la scheda no.`;
  } else if (fascia==="n11"){
    S.ki = Math.max(1, S.ki-1); S.soroban += 1; /* le perdite di Ki fuori dal combattimento si fermano a 1 (canone: Uscita Definitiva) */
    m = "11: notevole negativo. <b>−1 a scelta</b> — qui lo segniamo sul Ki. <b>Soroban: segna +1.</b>";
  } else {
    S.attr[attr] = Math.max(1, S.attr[attr]-1); S.ki = Math.max(1, S.ki-1); S.soroban += 2;
    m = `12: fallimento critico. <b>−1 a ${attr} e −1 al Ki.</b> E ricorda: a Ki ≤ 3 comincia il Genkai. <b>Soroban: segna +2.</b>`;
  }
  return m;
}

/* ── le scene ── */
const SCENE = [

/* 0 · copertina (segnaposto) */
{ tipo:"copertina" },

/* 1 */
{ img:"img/porta.jpg", alt:"Il corridoio buio verso la porta del bagno socchiusa",
  tag:"Scena 1 · la scena forte", titolo:"La porta del bagno",
  testo:[`Fushimi, un martedì di novembre, le 23:40. Ti ci ha mandato il capo ispettore, due parole al telefono: <em>«Un morto in casa, non mi torna. Vacci tu.»</em> Sei della Omicidi: quando qualcosa non torna, mandano te.`,
    `L'appartamento è in ordine, la televisione accesa senza volume. In fondo al corridoio la porta del bagno è socchiusa: dentro c'è un uomo di sessant'anni, <b>vestito</b> — e nessuno fa il bagno vestito — nella vasca che trabocca piano. È lì da ore. L'agente del kōban ha guardato dalla porta e ha richiuso, senza toccare niente. Il tuo collega, più giovane, aspetta un tuo cenno: tocca a te entrare per primo.`],
  tavolo:`GM: «La porta è socchiusa, la luce accesa. Cosa fai?» — Tu: «Mi metto i guanti. Entro, e guardo tutto prima di toccare qualsiasi cosa.» — GM: «Dentro c'è quello che c'è. Tira su Distacco.»`,
  tiro:{attr:"Distacco", label:"Non si tira per <em>trovare</em> — quello che c'è da vedere lo vedrai comunque. Si tira su <b>Distacco</b>: la distanza professionale davanti a una cosa che non si dimentica."},
  esiti:{
    k2:"Il freddo ti scende addosso come una mano sulla spalla. Registri tutto — l'acqua, la posizione, la tv muta — con una calma che quasi ti spaventa.",
    n3:"Respiri una volta sola, poi il mestiere prende il volante: la stanza si divide da sola in cose da fotografare e cose da non toccare.",
    ok:"Non è la prima volta e non sarà l'ultima. Voce bassa, guanti, taccuino: la scena resta una scena.",
    fl:"L'acqua che trabocca fa un rumore gentile, ed è quello a fregarti: troppo normale. Per un momento guardi l'uomo e vedi tuo padre. Poi torni dentro la divisa.",
    n11:"È l'odore a inseguirti — acqua ferma e dopobarba. Stanotte, chiudendo gli occhi, la vasca sarà ancora lì.",
    k12:"Devi uscire un momento nel corridoio. Il collega non dice niente — è successo a tutti — ma quel silenzio è un tipo particolare di rumore."
  },
  indizio:{img:"img/pantofole.jpg", alt:"Le pantofole appaiate davanti alla porta",
    titolo:"Le pantofole", voce:"Pantofole risistemate dopo la morte: c'era qualcun altro",
    testo:`Davanti alla porta, appaiate con cura, <b>le punte verso il corridoio</b>. Chi si toglie le pantofole entrando le lascia con le punte verso la porta, alla rinfusa; girarle «per bene» è la cortesia di chi le sistema <em>per qualcun altro</em>. Ma l'uomo è nella vasca: <b>qualcuno le ha risistemate dopo</b>.`},
  gm:"L'indizio non dipende dal tiro: si dà sempre, al massimo sfumato o per bocca del collega. Il tiro decide la scena, mai l'indagine." },

/* 2 */
{ img:"img/bagno.jpg", alt:"Il bagno: la vasca colma, il pavimento con una strisciata pulita",
  tag:"Scena 2 · il sopralluogo — e il Gou", titolo:"Quello che il bagno racconta",
  testo:[`Il medico legale arriverà tra un'ora. Il bagno intanto parla: la vasca colma, il rubinetto a filo, l'uomo vestito. Il bagno è fatto per l'acqua — pavimento che scola, gradino sulla soglia — e in tutte queste ore il trabocco ha coperto ogni segno là dentro, filtrando di sotto da qualche giunto stanco. È <b>fuori</b> dalla porta che qualcosa stona: sul pavimento del corridoio, dove la polvere ha il suo posto, una lunga <b>strisciata pulita</b> — uno straccio passato in fretta.`,
    `Puoi rileggere la stanza col mestiere. Oppure c'è l'altra strada: il tuo <b>Gou</b>, il dono che ti porti addosso — <b>Teatro delle Ombre 影芝居</b>. Guardi una scena, e vedi le sagome sbiadite di ciò che è accaduto. Ma un Gou non è gratis: si paga in Ki, per intero, prima di sapere come va.`],
  scelta:{dom:"Come rileggi la stanza?", opzioni:[
    {label:"🔍 Col mestiere", sotto:"tiro su Lucidità — non costa nulla", modo:"mestiere"},
    {label:"影 Col Gou: Teatro delle Ombre", sotto:"paghi subito 4 Ki, poi tiri su Lucidità", modo:"gou"}
  ]},
  tiroMestiere:{attr:"Lucidità", label:"Ricostruire a mente: l'ordine dei gesti, la direzione della strisciata, dove NON c'è acqua. Tira su <b>Lucidità</b>."},
  tiroGou:{attr:"Lucidità", label:"Il Gou è attivo: 4 Ki pagati, per intero. Ora tira su <b>Lucidità</b> — il tiro decide quanto le ombre ti mostrano."},
  esiti:{
    k2:"La stanza si riavvolge da sola: vedi l'ordine dei gesti come se li avessi fatti tu. C'è stata acqua dappertutto — e qualcuno l'ha tolta.",
    n3:"Segui la strisciata come una frase scritta male: parte dalla soglia del bagno, muore a metà corridoio. Uno straccio, strizzato due volte e sparito.",
    ok:"Metodo: fotografi, misuri, confronti. In tutto il corridoio la polvere ha il suo posto — tranne che davanti a quella porta: qui qualcuno ha pulito.",
    fl:"Ti ci vuole più del dovuto — la vasca continua a tirarti lo sguardo. È il collega a indicare il pavimento del corridoio: «Ispettore… qui è troppo pulito». Trovato è trovato.",
    n11:"Ricostruisci, ma a prezzo: ogni gesto immaginato te lo senti addosso. La strisciata la vedi — e non la dimentichi più.",
    k12:"Provi a riavvolgere la scena e la scena riavvolge te: per un attimo l'uomo nella vasca respira. Ti appoggi al muro. Il dato però è lì, innegabile."
  },
  esitiGou:{
    k2:"Le ombre si alzano nitide come teatro: <b>due sagome</b> nel vano della porta. La spinta. Una sagoma nella vasca, l'altra immobile — poi si china, e <b>asciuga il pavimento</b>. Esce con qualcosa sotto il braccio.",
    n3:"Tre quadri in dissolvenza: la lite, la caduta nell'acqua, la sagoma china che pulisce. Niente volti — il Gou non ne mostra mai — ma l'ordine è chiarissimo.",
    ok:"Le sagome sbiadite si muovono una volta sola: due figure, una cade, l'altra resta. Poi il gesto dello straccio, avanti e indietro. Ti basta.",
    fl:"Le ombre faticano a salire: ti resta <b>un solo quadro congelato</b> — una sagoma china sul pavimento, uno straccio in mano. Senza prima né dopo. Ma è già una confessione.",
    n11:"Un solo fotogramma, e ti costa: la sagoma china ti volta le spalle — e per un istante ha le TUE spalle. Il Gou prende sempre qualcosa in cambio.",

/* ── rendering ── */
const cont = document.getElementById("contenitore");
const chipBox = document.getElementById("stato-chip");
const chipKi = document.getElementById("chip-ki");
const chipScena = document.getElementById("chip-scena");
let ordineStanze = null;
let girando = null;

const SCENE_TOT = 9;
const stripScontro = document.getElementById("stato-scontro");
const STATO_SCONTRO = {
  pipsPg: document.getElementById("pips-pg"), numPg: document.getElementById("num-pg"), kiPg: document.getElementById("ki-pg"),
  pipsNip: document.getElementById("pips-nip"), numNip: document.getElementById("num-nip")
};
function aggiornaChip(){
  chipKi.textContent = S.ki;
  chipKi.parentElement.classList.toggle("genkai", S.ki <= 3);
  chipScena.textContent = "Scena " + S.scena + "/" + SCENE_TOT;
}
function tappeHtml(){
  let h = '<div class="tappe" aria-label="Avanzamento">';
  for (let i=1;i<=SCENE_TOT;i++) h += `<span class="${i<S.scena?'fatta':i===S.scena?'qui':''}" title="Scena ${i}"></span>`;
  return h + "</div>";
}
function taccuinoHtml(nuovaVoce){
  let h = '<div class="taccuino"><h4>Il tuo taccuino</h4><ul>';
  for (const v of S.indizi) h += `<li class="${v===nuovaVoce?'nuova':''}">${v}</li>`;
  return h + "</ul></div>";
}

function render(){
  window.scrollTo(0,0);
  stripScontro.hidden = true;
  if (S.scena===0) return renderCopertina();
  chipBox.hidden = false;
  aggiornaChip();
  const sc = SCENE[S.scena];
  if (sc.tipo==="scontro") return renderScontro(sc);
  if (sc.tipo==="finale") return renderFinale(sc);
  let dati = null;
  if (sc.dinamica==="stanzaA" && ordineStanze) dati = Object.assign({}, STANZE[ordineStanze[0]], {tagFisso:"Scena 3 · la casa parla"});
  if (sc.dinamica==="stanzaB"){
    if (!ordineStanze) ordineStanze = ["cucina","stanza"];
    dati = Object.assign({}, STANZE[ordineStanze[1]], {tagFisso:"Scena 4 · la casa parla ancora"});
  }
  renderScena(sc, dati || {});
}

function renderCopertina(){
  chipBox.hidden = true;
  cont.innerHTML = `
  <article class="scena">
    <img src="img/porta.jpg" alt="Un corridoio buio, la porta del bagno socchiusa">
    <div class="scena-corpo">
      <p class="scena-tag">Come si gioca — provalo</p>
      <h1>Un mini-caso, scena per scena</h1>
      <p class="filosofia">«I dadi non vi sbarrano nessuna porta — dicono soltanto quanto vi costa attraversarla, e quanto ne resta di voi dall'altra parte.»</p>
      <p>Nove scene, un appartamento, una notte. Un tiro per scena, qualche scelta, un taccuino che si riempie, un coltello che salta fuori — fino alle manette. Così funziona GENKAI: <b>gli indizi si trovano sempre</b>; i dadi decidono solo quanto ti costa trovarli.</p>
      <div class="tu">
        <span>Sei tu: <b>investigatore della Omicidi</b>, Kyoto 1997</span>
        <span>Distacco <b>6</b></span><span>Lucidità <b>7</b></span><span>Ascolto <b>6</b></span>
        <span>Pazienza <b>5</b></span><span>Silenzio <b>5</b></span><span>Presenza <b>4</b></span>
        <span>気 Ki <b>9</b></span><span>Gou: <b>Teatro delle Ombre 影芝居</b></span><span>Lame e bastoni <b>1</b> · Lotta <b>1</b></span><span>manganello in tasca</span>
      </div>
      <p style="font-family:var(--sans);font-size:.85rem;color:var(--tenue)">Una scheda così puoi fartela identica, in dieci minuti, col <a href="/Pg">wizard degli investigatori</a>.</p>
      <div class="bottoni" style="margin-top:1.2rem">
        <button type="button" class="btn btn-forte" id="comincia">Comincia il caso →</button>
      </div>
    </div>
  </article>`;
  document.getElementById("comincia").addEventListener("click", ()=>{ S.scena=1; render(); });
}

function bloccoTiro(label, attr){
  return `
  <div class="tiro-box">
    <p class="tiro-come">${label} Il tuo <b>${attr}</b> è <b>${S.attr[attr]}</b>: 2d6, somma ≤ ${S.attr[attr]} = successo. Sui dadi nudi: <b>2</b> critico · <b>3</b> notevole · <b>11</b> notevole negativo · <b>12</b> critico negativo.</p>
    <div class="bottoni"><button type="button" class="btn btn-forte" id="tira">🎲 Tira 2d6</button></div>
    <div id="area-tiro" hidden>
      <div class="dadi"><div class="dado" id="d1">·</div><div class="dado" id="d2">·</div></div>
      <p class="somma" id="somma"></p>
      <div class="dopo" id="dopo"></div>
      <div class="avanti-box" id="avanti-box"></div>
    </div>
  </div>`;
}

function renderScena(sc, dati){
  const tag = dati.tagFisso || sc.tag;
  const img = dati.img || sc.img, alt = dati.alt || sc.alt;
  const titolo = dati.titolo || sc.titolo;
  const testo = (dati.testo || sc.testo || []).map(p=>`<p>${p}</p>`).join("");
  const tavolo = (dati.tavolo || sc.tavolo) ? `<div class="tavolo"><b>Come si gioca, al tavolo</b>${dati.tavolo || sc.tavolo}</div>` : "";
  const conScelta = sc.scelta && !(sc.dinamica==="stanzaA" && ordineStanze) && !dati.tiro;

  let corpo;
  if (conScelta){
    corpo = `<div class="scelta"><p class="scelta-dom">${sc.scelta.dom}</p><div class="bottoni">` +
      sc.scelta.opzioni.map(o=>`<button type="button" class="btn" data-modo="${o.modo}">${o.label}<small>${o.sotto}</small></button>`).join("") +
      `</div></div><div id="dopo-scelta"></div>`;
  } else {
    const t = dati.tiro || sc.tiro;
    corpo = bloccoTiro(t.label, t.attr);
  }

  cont.innerHTML = `
  <article class="scena">
    <img src="${img}" alt="${alt}">
    <div class="scena-corpo">
      ${tappeHtml()}
      <p class="scena-tag">${tag}</p>
      <h2>${titolo}</h2>
      ${testo}
      ${tavolo}
      ${corpo}
    </div>
  </article>`;

  if (conScelta){
    cont.querySelectorAll("[data-modo]").forEach(b=>{
      b.addEventListener("click", ()=> gestisciScelta(sc, b.dataset.modo, b));
    });
  } else {
    const t = dati.tiro || sc.tiro;
    document.getElementById("tira").addEventListener("click", ()=> tira(sc, dati, t.attr, dati.modoTiro || null));
  }
}

function gestisciScelta(sc, modo, bottone){
  cont.querySelectorAll("[data-modo]").forEach(b=>{ b.disabled = true; b.style.pointerEvents = "none"; b.style.opacity = b===bottone ? "1" : ".35"; });
  const dove = document.getElementById("dopo-scelta");

  if (sc.dinamica==="stanzaA"){
    ordineStanze = modo==="cucina" ? ["cucina","stanza"] : ["stanza","cucina"];
    const d = Object.assign({}, STANZE[ordineStanze[0]], {tagFisso:"Scena 3 · la casa parla"});
    renderScena(sc, d);
    return;
  }
  if (S.scena===2){
    if (modo==="gou"){
      S.gouUsato = true;
      S.ki = Math.max(1, S.ki-4);
      aggiornaChip();
      dove.innerHTML = `<div class="mecc" style="margin-top:1rem"><b>Gou attivato</b>Teatro delle Ombre 影芝居: <b>−4 Ki, pagati per intero</b> (ora ne hai ${S.ki}). Le ombre si preparano — il tiro dice quanto vedrai.</div>` + bloccoTiro(sc.tiroGou.label, sc.tiroGou.attr);
    } else {
      dove.innerHTML = bloccoTiro(sc.tiroMestiere.label, sc.tiroMestiere.attr);
    }
    const t = modo==="gou" ? sc.tiroGou : sc.tiroMestiere;
    document.getElementById("tira").addEventListener("click", ()=> tira(sc, {}, t.attr, modo));
    return;
  }
  if (S.scena===7){
    const t = modo==="gentile" ? sc.tiroGentile : sc.tiroPressione;
    dove.innerHTML = bloccoTiro(t.label, t.attr);
    document.getElementById("tira").addEventListener("click", ()=> tira(sc, {}, t.attr, modo));
  }
}

function tira(sc, dati, attr, modo){
  const btn = document.getElementById("tira");
  btn.disabled = true; btn.style.pointerEvents = "none"; btn.style.opacity = ".4";
  document.getElementById("area-tiro").hidden = false;
  const d1 = document.getElementById("d1"), d2 = document.getElementById("d2");
  const sommaEl = document.getElementById("somma");
  d1.classList.add("rotola"); d2.classList.add("rotola");
  clearInterval(girando);
  girando = setInterval(()=>{ d1.textContent = 1+Math.floor(Math.random()*6); d2.textContent = 1+Math.floor(Math.random()*6); }, 80);
  setTimeout(()=>{
    clearInterval(girando);
    d1.classList.remove("rotola"); d2.classList.remove("rotola");
    const fascia = pesca();
    const val = S.attr[attr];
    const [a,b] = dadiPer(fascia, val);
    d1.textContent = a; d2.textContent = b;
    const s = a+b;
    sommaEl.innerHTML = `Somma <b>${s}</b> contro ${attr} <b>${val}</b> — ${s<=val?"riuscito":"fallito"}${(s===2||s===3||s===11||s===12)?" · e i dadi nudi dicono di più":""}`;
    mostraEsito(sc, dati, attr, fascia, modo);
  }, 750);
}

function mostraEsito(sc, dati, attr, fascia, modo){
  const meta = META[fascia];
  const testi = (modo==="gou" && sc.esitiGou) ? sc.esitiGou : (dati.esiti || sc.esiti);
  let mecc = "<b>Meccanica</b>" + applicaMecc(fascia, attr), extraMecc = "";
  if (modo==="gou") extraMecc = `<div class="mecc">${sc.meccGou}</div>`;
  aggiornaChip();

  const ind = dati.indizio || sc.indizio;
  S.indizi.push(ind.voce);
  const gm = (dati.gm || sc.gm) ? `<div class="gm"><b>Suggerimento GM</b>${dati.gm || sc.gm}</div>` : "";

  document.getElementById("dopo").innerHTML = `
    <div>
      <div class="esito ${meta.classe}">
        <h3>${meta.titolo}${meta.fascia?`<span class="fascia">${meta.fascia}</span>`:""}</h3>
        <p>${testi[fascia]}</p>
        <div class="indizio-card">
          <h4>${ind.titolo} — lo trovi comunque</h4>
          <p>${ind.testo}</p>
          ${ind.img?`<img src="${ind.img}" alt="${ind.alt||''}" loading="lazy">`:""}
        </div>
        <div class="mecc">${mecc}</div>
        ${extraMecc}
        ${gm}
      </div>
      ${S.ki<=3?`<div class="genkai-riga">気 Ki ${S.ki} — sei oltre il limite: al tavolo, qui comincerebbe il <b>Genkai</b>. Il caso continua, ma ogni passo costa.</div>`:""}
    </div>
    ${taccuinoHtml(ind.voce)}`;

  document.getElementById("avanti-box").innerHTML = `<button type="button" class="btn btn-forte" id="avanti">Scena successiva →</button>`;
  document.getElementById("avanti").addEventListener("click", ()=>{ S.scena++; render(); });
}

/* scena 8: lo scontro col coltello — motore condiviso (scontro.js), col Ki che il caso ti ha lasciato */
function renderScontro(sc){
  const pg = { attr:S.attr, ki:S.ki, kiMax:S.kiMax, senmon:{ "Lame e bastoni":1, "Lotta":1 } };
  cont.innerHTML = `
  <article class="scena">
    <img src="${sc.img}" alt="${sc.alt}">
    <div class="scena-corpo">
      ${tappeHtml()}
      <p class="scena-tag">${sc.tag}</p>
      <h2>${sc.titolo}</h2>
      ${sc.testo.map(p=>`<p>${p}</p>`).join("")}
      <div class="tavolo"><b>Come si gioca, al tavolo</b>${sc.tavolo}</div>
      <div class="gs" id="scontro-intro">
        ${GenkaiScontro.schedaBreve(pg)}
        <p class="regola">Arrivi a questo scontro col Ki che il caso ti ha lasciato: <b>${S.ki} su ${S.kiMax}</b>.${S.ki<=3?" Sei già oltre il limite: in combattimento il Genkai non scatta, ma il danno non si ferma — e la porta è dietro di te.":""}</p>
        <div class="bottoni riga" style="margin-top:.8rem"><button type="button" class="btn btn-forte" id="scontro-via">Lo scontro comincia →</button></div>
      </div>
      <div id="scontro-flusso"></div>
      <div class="avanti-box" id="avanti-box"></div>
    </div>
  </article>`;
  document.getElementById("scontro-via").addEventListener("click", ev => {
    ev.target.disabled = true;
    chipBox.hidden = true; stripScontro.hidden = false;
    GenkaiScontro.avvia({
      flusso: document.getElementById("scontro-flusso"), stato: STATO_SCONTRO, pg, rigioca: false,
      onFine: (esito, ki) => {
        S.ki = ki; S.esitoScontro = esito; aggiornaChip();
        S.indizi.push(esito==="fuga" ? "Ha tirato fuori un coltello: si è arreso ai rinforzi" : "Ha tirato fuori un coltello: resistenza e minaccia a pubblico ufficiale");
        const box = document.getElementById("avanti-box");
        box.innerHTML = `<button type="button" class="btn btn-forte" id="avanti">${esito==="morto" || esito==="aterra" ? "Il conto della notte →" : "Scena successiva →"}</button>`;
        document.getElementById("avanti").addEventListener("click", ()=>{ S.scena++; render(); });
      }
    });
  });
}

function renderFinale(sc){
  const sorobanFine = Math.min(9, Math.max(0, 5 + S.soroban));
  const e = S.esitoScontro;
  const racconto = e === "morto"
    ? `<p>L'1:20 di notte. Il caso lo chiude qualcun altro: il collega che risale le scale di corsa, l'agente del kōban, il rapporto del medico legale che domani dirà della vasca quello che il tuo taccuino diceva già. Il ragazzo lo prendono sul pianerottolo, col coltello ancora in mano e la faccia di chi non ha capito niente. Tu resti in cucina, sotto il neon.</p>
       <p>Il capo ispettore aveva ragione: non tornava. Adesso torna — ma senza di te.</p>`
    : e === "aterra"
    ? `<p>L'1:20 di notte. Il caso lo chiude qualcun altro: il collega che risale le scale di corsa ti trova sul pavimento della cucina, vivo, e il ragazzo bloccato sul pianerottolo dall'agente del kōban, col coltello ancora in mano. La lite, la spinta, la vasca, lo straccio, le pantofole, la busta: te lo racconterà lui domani, in ospedale, leggendo dal tuo taccuino.</p>
       <p>Il capo ispettore aveva ragione: non tornava. Adesso torna — e tu ci sei ancora, per un pelo.</p>`
    : e === "fuga"
    ? `<p>L'1:20 di notte. Dietro la porta il ragazzo ha urlato per un minuto; poi ha sentito le sirene e ha aperto lui, il coltello posato sul tavolo e le mani alzate. Esce tra il collega e un agente del kōban, i polsi chiusi dietro la schiena, senza guardare nessuno. Il medico legale confermerà domani quello che il taccuino dice già adesso: la lite, la spinta, la vasca — e poi lo straccio, le pantofole, la busta.</p>
       <p>Il capo ispettore aveva ragione: non tornava. Adesso torna.</p>`
    : `<p>L'1:20 di notte. Il ragazzo esce tra il collega e un agente del kōban, un braccio che gli pende dove l'ha preso il manganello, i polsi chiusi dietro la schiena, senza guardare nessuno. Il medico legale confermerà domani quello che il taccuino dice già adesso: la lite, la spinta, la vasca — e poi lo straccio, le pantofole, la busta.</p>
       <p>Il capo ispettore aveva ragione: non tornava. Adesso torna.</p>`;
  cont.innerHTML = `
  <article class="scena">
    <img src="${sc.img}" alt="${sc.alt}">
    <div class="scena-corpo">
      ${tappeHtml()}
      <p class="scena-tag">${sc.tag}</p>
      <h2>${sc.titolo}</h2>
      ${racconto}
      <div class="conto">
        <div><div class="num">気 ${S.ki}</div><div class="lbl">Ki rimasto (su 9)</div></div>
        <div><div class="num">${e==="morto"?"☠":e==="aterra"?"🩹":e==="fuga"?"🚪":"✓"}</div><div class="lbl">${e==="morto"?"a Ki 0: morto":e==="aterra"?"a Ki 0: vivo, a terra":e==="fuga"?"scontro evitato":"arrestato"}</div></div>
        <div><div class="num">${S.soroban>0?"+":""}${S.soroban}</div><div class="lbl">Soroban di stanotte</div></div>
        <div><div class="num">${S.indizi.length}</div><div class="lbl">righe di taccuino</div></div>
        ${S.nasake?`<div><div class="num">情 ${S.nasake}</div><div class="lbl">Nasake da donare</div></div>`:""}
      </div>
      <div class="mecc"><b>Il Soroban, a fine giornata</b>La scala 0–9 della scheda parte da ⑤: ogni critico o notevole la muove (2 → −2 · 3 → −1 · 11 → +1 · 12 → +2). Stanotte chiudi a <b>${sorobanFine}</b>. È un'altalena: com'è finita oggi decide da dove parte domani.</div>
      ${S.ki<=3 && e!=="morto"?`<div class="genkai-riga">Chiudi la notte a 気 Ki ${S.ki}: <b>oltre il limite</b>. Al tavolo, il rientro si tira a fine caso — 2d6 come dadi singoli, ogni dado ≤ Ki restituisce un punto. Il crollo che dà il nome al gioco: 限界, il limite. Il vostro.</div>`:""}
      ${taccuinoHtml(null)}
      <div class="lezione">
        <p><b>La lezione del mini-caso.</b> Sette tiri d'indagine, e nessuno ha mai fermato l'indagine: le pantofole, il pavimento, la tazza, la busta, la lite, la bugia si trovavano <em>comunque</em>. I dadi hanno deciso una cosa sola — <b>quanto della notte ti sei portato a casa</b>. Il Ki è il conto, il Soroban è l'altalena, il Gou è il dono che si paga.${e==="morto"?" E il coltello è l'unica scena in cui i dadi possono davvero chiudere la porta: GENKAI non è un gioco di combattimento, e andarsene era la mossa giusta.":e==="aterra"?" E il coltello, l'unica scena in cui i dadi possono chiudere la porta, l'ha lasciata aperta di un soffio: la regola opzionale del GM ti ha tenuto in vita — a terra.":e==="fuga"?" E davanti al coltello hai fatto la cosa più GENKAI di tutte: te ne sei andato.":" E il coltello, l'unica scena in cui i dadi possono davvero chiudere la porta, l'hai chiusa tu."} Questo è GENKAI.</p>
      </div>
      <div class="bottoni" style="margin-top:1.2rem">
        <a class="btn btn-forte" href="/Pg">✨ Crea il tuo investigatore</a>
        <button type="button" class="btn" id="ricomincia">↻ Rigioca il caso</button>
      </div>
      <p style="font-family:var(--sans);font-size:.82rem;color:var(--tenue);margin-top:.8rem">Rigiocalo: gli esiti escono sempre in ordine diverso, e le scelte — il Gou, l'ordine delle stanze, l'incalzo — cambiano il prezzo della notte.</p>
    </div>
  </article>`;
  document.getElementById("ricomincia").addEventListener("click", ()=>{
    S.attr = { "Distacco":6, "Lucidità":7, "Ascolto":6, "Pazienza":5, "Silenzio":5, "Presenza":4 };
    S.ki = 9; S.nasake = 0; S.soroban = 0; S.indizi = []; S.scena = 0; S.gouUsato = false; S.esitoScontro = null;
    mazzo = []; ultima = null; ordineStanze = null;
    render();
  });
}

render();
GenkaiCommenti.monta(document.getElementById("commenti"), { pagina: "provalo", extra: () => "scena " + S.scena + "/" + SCENE_TOT + (S.esitoScontro ? " · scontro: " + S.esitoScontro : "") + " · Ki " + S.ki });
})();
</script>
</body>

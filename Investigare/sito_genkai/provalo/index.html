<style>
:root{
  --carta:#f7f4ec; --carta2:#fffdf6; --carta3:#efe9dc;
  --inchiostro:#1c1a17; --inchiostro2:#4a453d; --tenue:#6a655c;

  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--carta);color:var(--inchiostro);font-family:var(--serif);font-size:17px;line-height:1.65;-webkit-text-size-adjust:100%}
img{max-width:100%;height:auto;display:block}
a{color:var(--rosso)}
.dentro{max-width:820px;margin:0 auto;padding:0 1.1rem}

.barra{position:sticky;top:0;z-index:50;background:rgba(247,244,236,.96);border-bottom:1px solid var(--bordo);backdrop-filter:blur(6px)}
.barra .dentro{display:flex;align-items:center;gap:.8rem;padding:.5rem 1.1rem}
.marchio{font-family:var(--sans);font-weight:700;letter-spacing:.04em;text-decoration:none;color:var(--inchiostro);font-size:.92rem;white-space:nowrap}
.marchio i{font-style:normal;color:var(--rosso)}
.stato-chip{margin-left:auto;display:flex;gap:.5rem;font-family:var(--sans);font-size:.8rem;align-items:center}
.chip{border:1px solid var(--bordo);background:#fff;border-radius:999px;padding:.15rem .65rem;white-space:nowrap}
.chip b{color:var(--rosso)}
.chip.genkai{border-color:var(--rosso);color:var(--rosso);font-weight:700}
.barra a.torna{font-family:var(--sans);font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--inchiostro2);text-decoration:none;white-space:nowrap}
@media(max-width:620px){ .barra a.torna{display:none} }

main{padding:1.4rem 0 3rem}

.scena{background:var(--carta2);border:1px solid var(--bordo);border-radius:12px;overflow:hidden}
.scena > img{width:100%}
.scena-corpo{padding:1.1rem 1.2rem 1.4rem}
.scena-tag{font-family:var(--sans);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--rosso);margin:0 0 .3rem}
h1{font-size:clamp(1.5rem,5vw,2.1rem);margin:0 0 .8rem;font-weight:400}
h2{font-size:clamp(1.25rem,4vw,1.55rem);margin:0 0 .8rem;font-weight:400}
.scena p{margin:0 0 .9rem;color:var(--inchiostro2)}
.filosofia{font-style:italic;color:var(--inchiostro2);border-top:1px solid var(--bordo);border-bottom:1px solid var(--bordo);padding:.8rem .4rem;margin:1rem 0;font-size:1rem}
.tu{display:flex;flex-wrap:wrap;gap:.35rem .8rem;font-family:var(--sans);font-size:.8rem;color:var(--tenue);border:1px dashed var(--bordo);border-radius:8px;padding:.55rem .8rem;margin:1rem 0}
.tu b{color:var(--inchiostro)}

/* parole da guardare */
.hot{font-family:inherit;font-size:inherit;line-height:inherit;color:var(--inchiostro);background:#f6efdd;border:0;border-bottom:2px dotted var(--oro);border-radius:3px;padding:0 .12em;margin:0;cursor:pointer;font-weight:600}
.hot:hover{background:#efe2c2}
.hot.vista{background:transparent;border-bottom-style:solid;border-bottom-color:var(--bordo);color:var(--tenue);font-weight:400}
.hot:disabled{cursor:default}

/* il riquadro di quello che vedi */
.fatto{border:1px solid var(--oro);border-left-width:4px;border-radius:0 10px 10px 0;background:#fbf7ec;padding:.85rem 1rem;margin:1rem 0 0}
.fatto h4{margin:0 0 .4rem;font-family:var(--sans);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--oro)}
.fatto p{margin:0 0 .2rem;color:var(--inchiostro)}
.fatto img{border-radius:6px;margin:.6rem 0 0}
.fatto .riga-img{display:flex;gap:1.1rem;align-items:flex-start;margin-top:.5rem}
.fatto .riga-img img{flex:0 0 auto;width:230px;margin:0;border-radius:8px;box-shadow:0 3px 14px rgba(28,26,23,.3)}
.fatto .riga-img .testo{flex:1 1 auto;min-width:0}
.fatto .riga-img .testo p{margin:0 0 .5rem}
@media(max-width:620px){ .fatto .riga-img{flex-direction:column;gap:.7rem} .fatto .riga-img img{width:100%;max-width:300px} }
.fatto .dett{font-family:var(--sans);font-size:.85rem;color:var(--tenue);margin-top:.5rem}
.voce-btn{margin-top:.7rem}

/* navigazione fra i luoghi */
.luoghi{display:flex;flex-wrap:wrap;gap:.4rem;margin:1.1rem 0 0;border-top:1px solid var(--bordo);padding-top:1rem}
.luoghi button{font-family:var(--sans);font-size:.85rem;padding:.5rem .8rem;border-radius:8px;border:1px solid var(--bordo);background:#fff;color:var(--inchiostro);cursor:pointer}
.luoghi button.qui{background:var(--inchiostro);border-color:var(--inchiostro);color:#fff}
.luoghi button:hover:not(.qui){background:var(--carta3)}
.luoghi .fine-btn{margin-left:auto;border-color:var(--rosso);color:var(--rosso);font-weight:700}
@media(max-width:560px){ .luoghi .fine-btn{margin-left:0;width:100%} }

/* taccuino */
.tacc{border:1px solid var(--bordo);border-radius:10px;background:#fff;padding:.9rem 1rem;font-family:var(--sans);margin-top:1.1rem}
.tacc h4{margin:0 0 .55rem;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--inchiostro2);display:flex;align-items:center;gap:.5rem}
.tacc h4 span{margin-left:auto;font-size:.78rem;letter-spacing:0;text-transform:none;color:var(--tenue)}
.tacc ul{margin:0;padding:0;list-style:none;font-size:.86rem;color:var(--inchiostro2)}
.tacc li{padding:.32rem 0;border-top:1px dotted var(--bordo)}
.tacc li:first-child{border-top:0}
.tacc li::before{content:"✎ ";color:var(--oro)}
.tacc li.data{color:var(--tenue)}
.tacc li.data::before{content:"▪ ";color:var(--tenue)}
.tacc li.nuova{color:var(--inchiostro);font-weight:600}
.tacc li.vuota{color:#bdb5a6;font-style:italic}
.tacc li.vuota::before{content:"▫ ";color:#cfc7b6}

/* tiro */
.tiro-box{border-top:1px solid var(--bordo);margin-top:1.1rem;padding-top:1.1rem}
.tiro-come{font-family:var(--sans);font-size:.85rem;color:var(--tenue);margin:0 0 .9rem}
.tiro-come b{color:var(--inchiostro)}
.dadi{display:flex;gap:.8rem;align-items:center;margin:.9rem 0 .3rem}
.dado{width:58px;height:58px;border:2px solid var(--inchiostro);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-family:var(--sans);font-weight:700;box-shadow:2px 3px 0 rgba(28,26,23,.15)}
.dado.rotola{animation:rotola .09s linear infinite}
@keyframes rotola{50%{transform:rotate(6deg) translateY(-2px)}}
@media(prefers-reduced-motion:reduce){ .dado.rotola{animation:none} }
.somma{font-family:var(--sans);font-size:.92rem;color:var(--inchiostro2);margin:0 0 .9rem}
.somma b{font-size:1.15rem;color:var(--inchiostro)}

.esito{border-radius:10px;border:1px solid var(--bordo);background:var(--carta);padding:1rem 1.1rem;margin-top:.5rem}
.esito h3{margin:0 0 .5rem;font-size:1.02rem;font-family:var(--sans);letter-spacing:.03em}
.esito.buono h3{color:var(--verde)}
.esito.neutro h3{color:var(--inchiostro2)}
.esito.brutto h3{color:var(--rosso)}
.esito p{margin:.5rem 0;color:var(--inchiostro2)}
.mecc{font-family:var(--sans);font-size:.84rem;background:var(--carta3);border-left:3px solid var(--oro);border-radius:0 6px 6px 0;padding:.6rem .8rem;margin:.7rem 0 0}
.mecc b:first-child{letter-spacing:.06em;text-transform:uppercase;font-size:.7rem;display:block;margin-bottom:.2rem}
.gou-box{border:1px solid var(--rosso);border-radius:10px;background:#fdf3f3;padding:.85rem 1rem;margin:1.1rem 0 0}
.gou-box h4{margin:0 0 .35rem;font-family:var(--sans);font-size:.8rem;letter-spacing:.06em;color:var(--rosso)}
.gou-box p{margin:0 0 .6rem;font-size:.95rem}
.ombre{font-style:italic;border-left:3px solid var(--rosso);padding-left:.9rem;margin:.8rem 0}

/* bottoni */
.bottoni{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1rem}
.btn{display:inline-block;font-family:var(--sans);font-size:1rem;padding:.8rem 1.4rem;border-radius:8px;text-decoration:none;border:1px solid var(--inchiostro);color:var(--inchiostro);background:transparent;cursor:pointer;transition:.15s;text-align:left}
.btn small{display:block;font-size:.75rem;color:var(--tenue);margin-top:.15rem}
.btn:hover:not(:disabled){background:rgba(28,26,23,.06)}
.btn:disabled{opacity:.4;cursor:default}
.btn-forte{background:var(--rosso);border-color:var(--rosso);color:#fff}
.btn-forte small{color:#f3d9d9}
.btn-forte:hover:not(:disabled){background:#a02020}
.btn-piccolo{font-size:.86rem;padding:.5rem .9rem}
@media(max-width:560px){ .bottoni .btn{width:100%;text-align:center} .bottoni .btn small{text-align:center} }

/* interrogatorio */
.lui{border-left:3px solid var(--bordo);padding-left:1rem;margin:1rem 0;font-size:1.05rem}
.io{border-left:3px solid var(--rosso);padding-left:1rem;margin:1rem 0;font-size:1.05rem;color:var(--inchiostro)}
.chiuso{font-family:var(--sans);font-size:.85rem;color:var(--verde);border:1px solid var(--verde);border-radius:8px;padding:.5rem .8rem;margin:.8rem 0 0;background:#f2f7f2}
.niente{font-family:var(--sans);font-size:.85rem;color:var(--tenue);border:1px dashed var(--bordo);border-radius:8px;padding:.5rem .8rem;margin:.8rem 0 0}

.avanti-box{margin-top:1.2rem;display:flex;justify-content:flex-end}
.genkai-riga{font-family:var(--sans);font-size:.85rem;color:var(--rosso);border:1px solid var(--rosso);border-radius:8px;padding:.55rem .8rem;margin-top:.9rem;background:#fdf3f3}
.conto{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.7rem;margin:1rem 0;font-family:var(--sans)}
.conto div{border:1px solid var(--bordo);border-radius:8px;background:#fff;padding:.7rem .8rem;text-align:center}
.conto .num{font-size:1.5rem;font-weight:700}
.conto .lbl{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}
.lezione{border-top:3px double var(--inchiostro);margin-top:1.4rem;padding-top:1rem;font-size:1rem}
.lezione b{color:var(--rosso)}
footer.fine{padding:1.6rem 0 0;text-align:center;font-family:var(--sans);font-size:.85rem;color:var(--tenue)}
[hidden]{display:none!important}
</style>

<script>
(function(){
"use strict";

/* ═══════════ STATO ═══════════ */
const BASE = { Distacco:6, Lucidità:7, Ascolto:6, Pazienza:5, Silenzio:5, Presenza:4 };
let S;
function nuovoStato(){
  S = {
    attr: Object.assign({}, BASE), ki:9, kiMax:9,
    righe:3, righeDecise:false,
    tacc: [],                 /* {id, testo, data:true se già data} */
    viste: {},                /* id voce → true */
    gouUsato:false, gouVisto:null,
    lettura:null,             /* esito del tiro quando si siede */
    chiusi:0, scambio:0, dette:{},
    esitoScontro:null,
    soroban:5,                /* la giornata parte da 5 e si muove sui critici */
    genkai:false, nasake:false, recuperati:null,
    passo:0,                  /* la parte guidata: arrivo · agente · medico · salma */
    fase:"copertina", luogo:"pianerottolo"
  };
  /* il taccuino parte VUOTO: le righe dell'agente e del medico arrivano quando ci parli */
}
nuovoStato();

const mie = () => S.tacc.filter(v => !v.data).length;
const ho = id => S.tacc.some(v => v.id === id);
const libere = () => S.righe - mie();

/* ═══════════ DADI ═══════════ */
function d6(){ return (typeof window.__dadoForzato === "function") ? window.__dadoForzato() : 1 + Math.floor(Math.random()*6); }
function fasciaDi(a, b, attr){
  const s = a + b;
  if (s === 2) return "k2";
  if (s === 3) return "n3";
  if (s === 12) return "k12";
  if (s === 11) return "n11";
  return s <= S.attr[attr] ? "ok" : "fl";
}
const META = {
  k2:{classe:"buono", titolo:"Kiwami 極 · 2 — successo critico"},
  n3:{classe:"buono", titolo:"Nami 波 · 3 — successo notevole"},
  ok:{classe:"buono", titolo:"Riuscito"},
  fl:{classe:"neutro", titolo:"Fallito"},
  n11:{classe:"brutto", titolo:"Nami 波 · 11 — fallimento notevole"},
  k12:{classe:"brutto", titolo:"Kiwami 極 · 12 — fallimento critico"}
};
/* le perdite fuori dal combattimento si fermano a 1 (canone) · il soroban si muove solo sui critici */
const sorobanMuovi = n => { S.soroban = Math.max(0, Math.min(9, S.soroban + n)); };
function applica(fascia, attr){
  if (fascia === "k2"){ S.ki = Math.min(S.kiMax, S.ki+1); S.attr[attr] = Math.min(10, S.attr[attr]+1); sorobanMuovi(+2); return `Dado 2: <b>+1 ${attr}</b> e <b>+1 Ki</b>. La scheda si ripara, e il soroban della giornata sale di due.`; }
  if (fascia === "n3"){ S.ki = Math.min(S.kiMax, S.ki+1); sorobanMuovi(+1); return "Dado 3: <b>+1 Ki</b>, e il soroban della giornata sale di uno."; }
  if (fascia === "n11"){ S.ki = Math.max(1, S.ki-1); sorobanMuovi(-1); return "Dado 11: <b>−1 Ki</b>, e il soroban scende di uno. Fuori dal combattimento non si va mai sotto 1."; }
  if (fascia === "k12"){ S.ki = Math.max(1, S.ki-1); S.attr[attr] = Math.max(4, S.attr[attr]-1); sorobanMuovi(-2); return `Dado 12: <b>−1 ${attr}</b> e <b>−1 Ki</b>, e il soroban scende di due. Il punto di attributo si ripara nella notte.`; }
  return "Nessuna conseguenza: la scheda resta com'è.";
}
/* tiro di pressione (Briefing): fino all'attributo reggi · da 10 in su −1 Ki · niente Kiwami né Nami */
function pressione(a, b, attr){
  const s = a + b;
  if (s <= S.attr[attr]) return "regge";
  if (s <= 9) return "sforzo";
  return "erode";
}

/* ═══════════ I LUOGHI ═══════════ */
const LUOGHI = {
  pianerottolo: {
    nome:"Il pianerottolo", tag:"Terzo piano, quasi mezzanotte", titolo:"L'acqua sulle scale",
    img:"img/pianerottolo.jpg", alt:"Il ballatoio del palazzo, di notte, sotto la pioggia",
    testo:[
      `Un palazzo di quelli tirati su in fretta trent'anni fa: ballatoi esterni, il cemento a vista, i panni di qualcuno lasciati fuori a prendere la pioggia. L'ascensore non c'è mai stato. Al secondo piano una televisione va forte dietro una porta chiusa, e qualcuno ride.`,
      `Ti ha mandato qui il commissario <b>Taniguchi Osamu</b>, capo della Sezione Omicidi, con la voce di uno che sta cenando: gli è arrivata una segnalazione dal personale dell'ambulanza. Un uomo trovato morto in casa sua, e una cosa che secondo il medico non torna. <em>«Vacci tu. Guarda, e poi dimmi se è come dicono.»</em>`,
      `Sali con la giacca che gocciola. Gli scalini sono bagnati fin dal primo pianerottolo, e l'aria sa di muffa e di cemento umido, quell'odore che nei palazzi vecchi non se ne va più. Sotto il neon del ballatoio, l'[[acqua]] esce da sotto la [[porta]] e scende a filo di muro, gradino dopo gradino, come se la casa si stesse svuotando piano.`,
      `Un agente del posto di polizia ti aspetta sulla soglia, in piedi, con le scarpe in mano e i calzini fradici. Dentro, lontana, si sente una televisione.`
    ],
    voci:{
      acqua:{ fatto:"Viene da dentro. Scorre da ore: sul cemento del ballatoio c'è già l'alone scuro del bagnato vecchio, e la pozza arriva fino alla ringhiera.", nota:"L'acqua esce dall'appartamento da ore" },
      porta:{ fatto:"Chiusa, non forzata. L'agente l'ha aperta con la chiave del custode. Nessun segno sullo stipite, nessuno sulla serratura.", nota:"Porta chiusa, nessuna forzatura" }
    }
  },
  cucina: {
    nome:"La stanza", tag:"Dentro casa", titolo:"Una stanza sola",
    img:"img/cucina.jpg", alt:"La cucina di notte",
    testo:[
      `Rettangolare: si mangia e si cucina qui. L'aria è ferma, sa di chiuso e di roba lasciata lì.`,
      `Sul tavolo una [[teiera]] scoperchiata. Nel [[lavello]] i piatti sono accatastati e incrostati, e sopra a tutti ci sono [[due tazze]]. Il [[frigorifero]] ronza contro la parete.`,
      `In un angolo la [[televisione]] parla da sola. Davanti, un tavolino basso con una pila di [[riviste]] e un [[portafogli]].`,
      `Il pavimento è appiccicoso. Da questa parte l'acqua non è ancora arrivata.`
    ],
    voci:{

      "due tazze":{ fatto:"Due tazze uguali, dello stesso servizio. Sul fondo di tutte e due le foglie di tè sono ancora umide. Sotto, nel lavello, il resto è secco e attaccato da giorni.", nota:"Due tazze nel lavello, foglie di tè ancora umide" },
      teiera:{ fatto:"Scoperchiata al centro del tavolo, con dentro le foglie usate. Sotto il beccuccio, sul legno, una macchia rotonda ancora appiccicosa.", nota:"Teiera lasciata sul tavolo, foglie usate dentro" },
      riviste:{ fatto:"Una pila di riviste vecchie, allineate agli angoli. Sul legno la polvere disegna il contorno di una pila più larga. Sollevandole trovi una busta dell'ufficio postale, col timbro di oggi e una cifra scritta a mano. Dentro non c'è niente.", nota:"Busta della pensione, timbro di oggi, trovata vuota sotto le riviste" },
      portafogli:{ fatto:"Aperto sul tavolino. Dentro, tre monete e una banconota piccola. Nient'altro.", nota:"Nel portafogli tre monete e una banconota piccola" },
      frigorifero:{ fatto:"Dentro c'è mezzo cavolo, una bottiglia di birra e un vasetto senza etichetta. Sul ripiano di sotto, il segno tondo di qualcosa che è stato tolto tempo fa e mai pulito.", nota:"Frigorifero praticamente vuoto" },
      lavello:{ fatto:"Piatti, ciotole e bacchette impilati alla rinfusa, il grasso ormai secco. In cima, appoggiato di traverso sui piatti, un coltello da cucina con il manico di legno consumato. Il rubinetto gocciola.", nota:"Piatti sporchi da giorni, e un coltello lasciato sopra la pila" }
    }
  },
  bagno: {
    nome:"Il bagno", tag:"La prima porta a destra", titolo:"Un centimetro d'acqua",
    img:"img/bagno.jpg", alt:"Il bagno: la vasca colma, il pavimento allagato",
    testo:[
      `Piccolo, senza spogliatoio: si entra e c'è la vasca. Il pavimento ti bagna le suole appena metti dentro un piede.`,

      `Davanti alla porta, appaiate, ci sono le [[pantofole]].`,

    ],

function chip(){
  chipKi.textContent = S.ki;

    ? "Taccuino " + mie() + "/" + S.righe
    : "Taccuino " + (S.tacc.length === 0 ? "vuoto" : S.tacc.length === 1 ? "1 riga" : S.tacc.length + " righe");

function taccHtml(nuova){
  const q = mie() === 0 ? "nessuna riga" : mie() === 1 ? "una riga" : mie() + " righe";
  const conta = S.righeDecise ? `${q} su ${S.righe}` : "";
  let h = `<div class="tacc"><h4>Il tuo taccuino <span>${conta}</span></h4><ul>`;
  if (!S.tacc.length && !S.righeDecise) h += `<li class="vuota">ancora bianco</li>`;
  for (const v of S.tacc) h += `<li class="${v.data?'data':''}${v.id===nuova?' nuova':''}">${v.testo}</li>`;
  if (S.righeDecise) for (let i = mie(); i < S.righe; i++) h += `<li class="vuota">riga libera</li>`;
  return h + "</ul></div>";
}

  if (S.fase === "arriva")    return renderArrivo();
  if (S.fase === "interr")    return renderInterrogatorio();
  if (S.fase === "scontro")   return renderScontro();
  if (S.fase === "dopo")      return renderDopo();
  if (S.fase === "finale")    return renderFinale();
}

      : `<p>${r.che}</p>`;
    document.getElementById("spiega-roba").innerHTML = `<div class="fatto"><h4>${r.k}</h4>${corpo}</div>`;
  }));
  document.getElementById("comincia").addEventListener("click", ()=>{ S.fase="casa"; S.luogo="pianerottolo"; render(); });
}

/* ── un luogo: testo con le parole da guardare ── */
const idVoce = (L, chiave) => (L.voci[chiave] && L.voci[chiave].id) || chiave;
function testoHtml(L){
  return L.testo.map(p => `<p>${p.replace(/\[\[([^\]]+)\]\]/g, (m, parola) => {
    const chiave = parola.toLowerCase();
    const vista = S.viste[idVoce(L, chiave)] ? " vista" : "";
    return `<button type="button" class="hot${vista}" data-voce="${chiave}">${parola}</button>`;
  })}</p>`).join("");
}

function renderLuogo(){
  const L = LUOGHI[S.luogo];
  if (STANZE.indexOf(S.luogo) >= 0) S.viste["stanza-"+S.luogo] = true;
  /* quello che ti consegnano in mano entra nel taccuino da sé, e non ti costa una riga */
  let appena = null;
  if (L.dai && !ho(L.dai.id)){ S.tacc.push({ id:L.dai.id, testo:L.dai.testo, data:true }); appena = L.dai.id; chip(); }
  const img = L.img ? `<img src="${L.img}" alt="${L.alt||''}">` : "";
  const gou = (!S.gouUsato && GOU[S.luogo]) ? `
    <div class="gou-box">
      <h4>業 Il tuo Gou — Teatro delle Ombre 影芝居</h4>
      <p>Ti fermi in mezzo alla stanza e non fai niente. Non è una cosa che hai imparato: ti succede da sempre, e ogni volta ti lascia svuotato. Le cose intorno si rimettono al loro posto e i gesti tornano nell'ordine in cui sono stati fatti.</p>
      <div class="bottoni"><button type="button" class="btn btn-piccolo" id="usa-gou">Fermarti qui<small>costa 3 Ki, pagati subito. Una volta sola stanotte</small></button></div>
    </div>` : "";

  cont.innerHTML = `
  <article class="scena">
    ${img}
    <div class="scena-corpo">
      <p class="scena-tag">${L.tag}</p>
      <h2>${L.titolo}</h2>
      ${testoHtml(L)}
      ${appena ? `<div class="chiuso">Te l'ha messa in mano lui: va nel taccuino, e non ti costa una riga.</div>` : ""}
      <div id="fatto"></div>
      ${gou}
      <div id="gou-esito"></div>
      ${taccHtml(appena)}
      <div class="luoghi" id="luoghi"></div>
    </div>
  </article>`;

  cont.querySelectorAll("[data-voce]").forEach(b => b.addEventListener("click", () => guarda(L, b.dataset.voce, b)));
  const g = document.getElementById("usa-gou");
  if (g) g.addEventListener("click", usaGou);
  disegnaLuoghi();
}

/* in fondo: nella parte guidata un solo bottone, dopo la casa si gira liberamente */
const AVANTI_GUIDATO = [
  "L'agente ti aspetta sulla soglia →",
  "Il medico, prima che se ne vada →",
  "La barella sul ballatoio →",
  "Entri in casa →"
];
function disegnaLuoghi(){
  const box = document.getElementById("luoghi");
  if (!box) return;
  if (S.passo < SEQUENZA.length){
    /* sulla salma si prosegue solo dopo aver guardato sotto il lenzuolo */
    const bloccato = (S.luogo === "salma" && !S.viste["salma-tirata"]);
    box.innerHTML = `<button type="button" class="fine-btn" id="avanti-guida"${bloccato?" disabled":""}>${AVANTI_GUIDATO[S.passo]}</button>`;
    if (!bloccato) document.getElementById("avanti-guida").addEventListener("click", ()=>{ S.passo++; render(); });
    return;
  }
  const viste = STANZE.filter(k => S.viste["stanza-"+k]).length;
  const tutte = viste === STANZE.length;
  box.innerHTML = ORDINE.map(k =>
    `<button type="button" data-vai="${k}" class="${k===S.luogo?'qui':''}">${LUOGHI[k].nome}</button>`
  ).join("") + `<button type="button" class="fine-btn" id="chiudi-casa">${tutte ? "Di sotto è arrivato qualcuno →" : "Ho visto abbastanza →"}</button>`;
  box.querySelectorAll("[data-vai]").forEach(b => b.addEventListener("click", ()=>{ S.luogo = b.dataset.vai; render(); }));
  document.getElementById("chiudi-casa").addEventListener("click", chiudiCasa);
}

/* ── guardare una voce ── */
function guarda(L, chiave, bottone){
  const v = L.voci[chiave];
  if (!v) return;
  const id = idVoce(L, chiave);
  S.viste[id] = true;
  bottone.classList.add("vista");

  if (v.vai){ S.luogo = v.vai; render(); return; }

  const box = document.getElementById("fatto");
  const img = v.img ? `<img src="${v.img}" alt="${v.alt||''}" loading="lazy">` : "";
  const dett = v.dett ? `<p class="dett">${v.dett}</p>` : "";
  box.innerHTML = `
    <div class="fatto">
      <h4>${chiave}</h4>
      <p>${v.fatto}</p>
      ${img}${dett}
      <div class="voce-btn" id="voce-btn"></div>
    </div>`;

  if (v.tiro === "foto" && !S.viste["foto-tirata"]) tiroFoto();
  else if (v.tiro === "salma" && !S.viste["salma-tirata"]) tiroSalma();
  else segnabile(v, id, document.getElementById("voce-btn"));
  scrolla(box);
}

function segnabile(v, id, b){
  if (!b) return;
  if (!v.nota){ b.innerHTML = ""; return; }
  if (ho(id)){ b.innerHTML = `<p class="dett">Già sul taccuino.</p>`; return; }
  if (libere() <= 0){
    b.innerHTML = `<p class="dett">Le righe sono finite. Puoi guardare quanto vuoi, ma sul tavolo ci va solo quello che hai scritto.</p>`;
    return;
  }
  b.innerHTML = `<div class="bottoni"><button type="button" class="btn btn-piccolo" data-segna="1">✎ Segnalo sul taccuino<small>${v.nota}</small></button></div>`;
  b.querySelector("[data-segna]").addEventListener("click", ()=>{
    S.tacc.push({ id, testo:v.nota });
    chip();
    render();
  });
}

/* ── motore del tiro ── */
function tira(attr, areaId, poi, ev){
  if (ev && ev.currentTarget) ev.currentTarget.disabled = true;
  const area = document.getElementById(areaId);
  area.hidden = false;
  const dadi = area.querySelectorAll(".dado");
  const d1 = dadi[0], d2 = dadi[1];
  const sommaEl = area.querySelector(".somma");
  d1.classList.add("rotola"); d2.classList.add("rotola");
  clearInterval(girando);
  girando = setInterval(()=>{ d1.textContent = 1+Math.floor(Math.random()*6); d2.textContent = 1+Math.floor(Math.random()*6); }, 80);
  setTimeout(()=>{
    clearInterval(girando);
    d1.classList.remove("rotola"); d2.classList.remove("rotola");
    const a = d6(), b = d6();
    d1.textContent = a; d2.textContent = b;
    const s = a + b, val = S.attr[attr];
    const fascia = fasciaDi(a, b, attr);
    sommaEl.innerHTML = `Somma <b>${s}</b> contro ${attr} <b>${val}</b> — ${s<=val?"riuscito":"fallito"}`;
    poi(fascia, a, b);
    scrolla(area);
  }, 750);
}

/* ── interrogatorio ── */
function renderInterrogatorio(){
  const sc = SCAMBI[S.scambio];
  const apri = sc.apri ? `<p class="io">${sc.apri}</p>` : "";
  cont.innerHTML = `
  <article class="scena">
    <img src="img/incalzo.jpg" alt="Il giovane seduto al tavolo di cucina, sotto la lampada">
    <div class="scena-corpo">
      <p class="scena-tag">L'interrogatorio · ${S.scambio+1} di ${SCAMBI.length} — ${sc.tema}</p>
      <h2>${sc.tema.charAt(0).toUpperCase()+sc.tema.slice(1)}</h2>
      ${apri}
      <p class="lui">${sc.lui}</p>
      <div id="scelte"></div>
      <div id="esito-scambio"></div>
      ${taccHtml()}
      <div class="avanti-box" id="avanti-box"></div>
    </div>
  </article>`;
  if (sc.tiro) return scambioTiro(sc);

  const disponibili = (sc.opzioni||[]).filter(o => ho(o.carta) && (!o.serve || ho(o.serve)));
  /* se due opzioni usano la stessa carta, tengo solo la prima disponibile */
  const viste = {}, opz = [];
  for (const o of disponibili){ if (viste[o.carta]) continue; viste[o.carta] = true; opz.push(o); }

  const box = document.getElementById("scelte");
  box.innerHTML = `<p class="scena-tag" style="color:var(--tenue)">Cosa gli metti sul tavolo</p><div class="bottoni">` +
    opz.map((o,i)=>`<button type="button" class="btn" data-op="${i}">${rigaDi(o.carta)}</button>`).join("") +
    `<button type="button" class="btn" data-op="-1">Lascio parlare lui<small>non metti niente sul tavolo</small></button></div>`;
  box.querySelectorAll("[data-op]").forEach(b => b.addEventListener("click", ()=>{
    box.querySelectorAll("[data-op]").forEach(x=>{ x.disabled = true; });
    const i = parseInt(b.dataset.op, 10);
    const dove = document.getElementById("esito-scambio");
    if (i < 0){
      dove.innerHTML = `<p>${sc.vuoto}</p><div class="niente">Non hai messo niente sul tavolo. Lui si allarga.</div>`;
    } else {
      const o = opz[i];
      S.dette[o.carta] = true;
      dove.innerHTML = `<p class="io">${o.frase}</p><p class="lui">${o.risposta}</p>` +
        (o.chiude ? `<div class="chiuso">Gli si chiude una porta: <b>${o.chiude}</b></div>` : `<div class="niente">Non gli si chiude niente. Ha una risposta e la usa.</div>`);
      if (o.chiude) S.chiusi++;
    }
    avantiScambio();
    scrolla(dove);
  }));
}

/* ── lo scontro (motore condiviso) ── */
function renderScontro(){

        </div>`;
      chip();
    }, 750);
  });
}

      const m = META[fascia];
      document.getElementById("e2").innerHTML = `
        <div class="esito ${m.classe}"><h3>${m.titolo}</h3><p>${testi[fascia]}</p>
          <div class="mecc"><b>Meccanica</b>${applica(fascia,"Lucidità")}</div>
          <div class="mecc"><b>Il tuo taccuino</b>Hai <b>${righe} righe</b> tue, oltre a quelle che ti hanno messo in mano l'agente e il medico. Guardare non costa niente: scrivere sì.</div>
        </div>
        <div class="avanti-box"><button type="button" class="btn btn-forte" id="entra">Entri in casa →</button></div>`;
      chip();
      document.getElementById("entra").addEventListener("click", ()=>{ S.fase="casa"; S.luogo="cucina"; render(); });
    }, ev);
  });
}

render();
})();
</script>
</body>
</html>

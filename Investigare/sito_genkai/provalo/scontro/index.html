<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GENKAI — Un coltello in cucina · prova il combattimento</title>
<meta name="description" content="Prova il combattimento di GENKAI in cinque minuti, da solo, sul telefono: un investigatore, un ragazzo con un coltello, i dadi. Si impara giocando.">
<link rel="icon" href="../../img/favicon.png">
<link rel="stylesheet" href="../scontro.css?v=20260906f">
<style>
:root{
  --carta:#f7f4ec; --carta2:#fffdf6; --carta3:#efe9dc;
  --inchiostro:#1c1a17; --inchiostro2:#4a453d; --tenue:#6a655c;
  --rosso:#8b1a1a; --bordo:#d8cfc0; --oro:#b08d2f; --verde:#2e6b30;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--carta);color:var(--inchiostro);font-family:var(--serif);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
img{max-width:100%;height:auto;display:block}
a{color:var(--rosso)}
.dentro{max-width:680px;margin:0 auto;padding:0 .9rem 3rem}
.barra{position:sticky;top:0;z-index:50;background:rgba(247,244,236,.97);border-bottom:1px solid var(--bordo);backdrop-filter:blur(6px)}
.barra .dentro{display:flex;align-items:center;gap:.8rem;padding:.45rem .9rem}
.marchio{font-family:var(--sans);font-weight:700;font-size:.85rem;letter-spacing:.04em;white-space:nowrap;text-decoration:none;color:var(--inchiostro)}
.marchio i{font-style:normal;color:var(--rosso)}
@media(max-width:480px){ .marchio .extra{display:none} .barra .dentro{gap:.5rem;padding:.4rem .7rem} }
footer.fine{padding:1.6rem 0 0;text-align:center;font-family:var(--sans);font-size:.85rem;color:var(--tenue)}
[hidden]{display:none!important}
</style>
</head>
<body>

<nav class="barra"><div class="dentro">
  <a class="marchio" href="../../">限界 <i>GENKAI</i><span class="extra"> · lo scontro</span></a>
  <div class="stato-scontro">
    <div class="ki mio" id="ki-pg"><span class="eti">Tu · Ki</span><span class="riga"><span class="pips" id="pips-pg"></span><span class="num" id="num-pg">7</span></span></div>
    <div class="ki lui" id="ki-nip"><span class="eti">Lui · Ki</span><span class="riga"><span class="pips" id="pips-nip"></span><span class="num" id="num-nip">5</span></span></div>
  </div>
</div></nav>

<main><div class="dentro">
  <div id="copertina"></div>
  <div id="flusso"></div>
  <div id="commenti"></div>
  <footer class="fine">
    <p><a href="../">Gioca il mini-caso completo</a> · <a href="../../">Torna a genkai.it</a> · <a href="/Pg">✨ Crea il tuo investigatore</a></p>
  </footer>
</div></main>

<script src="../scontro.js?v=20260906f"></script>
<script src="../commenti.js?v=20260906f"></script>
<script>
(function(){
  const stato = {
    pipsPg: document.getElementById("pips-pg"), numPg: document.getElementById("num-pg"), kiPg: document.getElementById("ki-pg"),
    pipsNip: document.getElementById("pips-nip"), numNip: document.getElementById("num-nip")
  };
  const pg = { attr:{Distacco:6, Pazienza:5, Silenzio:5, Lucidità:7, Ascolto:6, Presenza:4}, ki:7, kiMax:7, senmon:{ "Manganello":1, "Lotta":1 } };
  let esito = "";
  GenkaiScontro.copertina(document.getElementById("copertina"), {
    immagine: "../img/coltello.jpg",
    flusso: document.getElementById("flusso"),
    stato, pg,
    onFine: (tipo, ki) => { esito = tipo + " a Ki " + ki; }
  });
  GenkaiCommenti.monta(document.getElementById("commenti"), { pagina: "provalo/scontro", extra: () => esito });
})();
</script>
</body>
</html>

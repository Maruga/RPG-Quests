<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Il Cantiere — mappa da tavolo (A3)</title>
<style>
  @page { size: A3 landscape; margin: 0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:420mm; height:297mm; }
  body {
    font-family: "Courier New", "MS Gothic", monospace;
    background:#f2ecdd; color:#1a2733;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
    padding:6mm 8mm;
  }
  .header{ display:flex; align-items:baseline; justify-content:space-between; gap:6mm;
    border-bottom:1mm solid #1a2733; padding-bottom:1.6mm; margin-bottom:2.5mm; }
  .header .t1{ font-size:8mm; font-weight:bold; letter-spacing:1.5px; white-space:nowrap;}
  .header .t2{ font-size:3.2mm; letter-spacing:.4px;}
  .stamp{ border:0.9mm solid #b3372c; color:#b3372c; font-weight:bold; white-space:nowrap;
    padding:1mm 3mm; font-size:4.4mm; transform:rotate(-2deg); letter-spacing:2px;
    background:rgba(255,255,255,.35);}
  .meta{ text-align:right; font-size:3mm; line-height:1.5; white-space:nowrap;}
  .mapcol{ height:262mm; border:0.6mm solid #1a2733; background:#f6f1e4; }
</style>
</head>
<body>

<div class="header">
  <div class="t1">「解体屋」 IL CANTIERE <span class="t2">— ex demolizioni navali · porto OVEST di Maizuru</span></div>
  <div class="stamp">極秘 · TOP SECRET</div>
  <div class="meta">rilievo 13.11.1986 · scala 1:600 ca. · <b>35.4526 N · 135.31553 E</b></div>
</div>

<div class="mapcol">
<svg viewBox="0 0 1560 1010" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <pattern id="water" width="46" height="16" patternUnits="userSpaceOnUse">
      <rect width="46" height="16" fill="#cfdde2"/>
      <path d="M0 8 q 11 -7 23 0 t 23 0" stroke="#8fb0bc" fill="none" stroke-width="1.6"/>
    </pattern>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M0 9 L9 0" stroke="#8b9aa5" stroke-width="1"/>
    </pattern>
    <pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 0 L7 7" stroke="#c8b98f" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1560" height="1010" fill="#f6f1e4"/>

  <!-- griglia cartografica -->
  <g stroke="#1a273310" stroke-width="1">
    <path d="M260 0V1010 M520 0V1010 M780 0V1010 M1040 0V1010 M1300 0V1010"/>
    <path d="M0 202H1560 M0 404H1560 M0 606H1560 M0 808H1560"/>
  </g>
  <g font-size="16" fill="#1a273355">
    <text x="122" y="22">A</text><text x="382" y="22">B</text><text x="642" y="22">C</text>
    <text x="902" y="22">D</text><text x="1162" y="22">E</text><text x="1420" y="22">F</text>
    <text x="10" y="108">1</text><text x="10" y="310">2</text><text x="10" y="512">3</text>
    <text x="10" y="714">4</text><text x="10" y="916">5</text>
  </g>

  <!-- ===== ACQUA ===== -->
  <path d="M1310 0 L1560 0 L1560 1010 L1290 1010 Q1300 700 1304 500 Q1308 220 1310 0 Z" fill="url(#water)"/>
  <text x="1395" y="80" font-size="30" fill="#54707c" font-family="serif" font-style="italic">舞鶴湾</text>
  <text x="1372" y="110" font-size="14" fill="#54707c" letter-spacing="1">BAIA — braccio ovest</text>
  <text x="1370" y="975" font-size="14" fill="#54707c">fondale 6-8 m</text>

  <!-- ===== BANCHINA (a EST, con la gru) ===== -->
  <path d="M1180 40 L1310 40 Q1308 220 1304 500 Q1300 700 1290 970 L1180 970 Z" fill="#ded5bd" stroke="#1a2733" stroke-width="3"/>
  <text x="1252" y="150" font-size="15" transform="rotate(90 1252 150)" letter-spacing="2">B A N C H I N A</text>
  <!-- bitte -->
  <g fill="#1a2733"><circle cx="1296" cy="200" r="6"/><circle cx="1294" cy="430" r="6"/><circle cx="1292" cy="660" r="6"/><circle cx="1288" cy="880" r="6"/></g>
  <!-- scaletta al mare -->
  <g stroke="#1a2733" stroke-width="2"><path d="M1298 760 h26 M1298 772 h26 M1298 784 h26 M1298 760 v24 M1324 760 v24"/></g>

  <!-- GRU A PORTALE: interamente sulla banchina, binari nord-sud -->
  <g stroke="#1a2733" fill="none">
    <path d="M1198 130 L1198 900 M1284 130 L1284 900" stroke-width="2.5" stroke-dasharray="5 9"/>
    <path d="M1198 620 L1198 470 L1284 470 L1284 620" stroke-width="7"/>
    <rect x="1206" y="420" width="70" height="44" fill="#e9e1cb" stroke="#1a2733" stroke-width="3.5"/>
  </g>
  <rect x="1188" y="380" width="248" height="42" fill="#f6f1e4" opacity=".9"/>
  <text x="1195" y="396" font-size="15" font-weight="bold">GRU A PORTALE — quota 25 m</text>
  <text x="1195" y="414" font-size="12">binari lungo la banchina</text>

  <!-- CHIATTA -->
  <g transform="translate(1302,545) rotate(7)">
    <rect x="0" y="0" width="150" height="56" rx="9" fill="#c8bfa4" stroke="#1a2733" stroke-width="2.5"/>
    <rect x="14" y="11" width="88" height="34" fill="url(#hatch2)" stroke="#1a2733" stroke-width="1.2"/>
  </g>
  <text x="1338" y="530" font-size="14">CHIATTA (ormeggiata)</text>

  <!-- ===== RECINZIONE (est aperto sulla banchina) ===== -->
  <g stroke="#1a2733" stroke-width="2.2" stroke-dasharray="11 6" fill="none">
    <path d="M300 120 L1180 120"/>
    <path d="M300 120 L300 448"/>
    <path d="M300 582 L300 950"/>
    <path d="M300 950 L1180 950"/>
  </g>
  <text x="640" y="106" font-size="14">recinzione — rete e filo spinato</text>
  <text x="560" y="990" font-size="14">recinzione — rete e filo spinato</text>

  <!-- ===== STRADA + CANCELLO davanti all'ingresso ===== -->
  <rect x="0" y="460" width="300" height="110" fill="#cfc4a6"/>
  <g stroke="#f6f1e4" stroke-width="3" stroke-dasharray="22 16"><path d="M0 515 H298"/></g>
  <text x="30" y="448" font-size="15" font-weight="bold">STRADA UNICA</text>
  <!-- cancello: apertura del recinto allineata all'ingresso principale -->
  <line x1="300" y1="452" x2="300" y2="578" stroke="#b3372c" stroke-width="8"/>
  <text x="180" y="600" font-size="14" fill="#b3372c" font-weight="bold">CANCELLO + sbarra</text>
  <text x="186" y="618" font-size="13">cartello 工事中</text>
  <!-- guardiola a lato del cancello -->
  <rect x="316" y="380" width="66" height="44" fill="#e9e1cb" stroke="#1a2733" stroke-width="2.5"/>
  <text x="314" y="370" font-size="13">guardiola</text>

  <!-- ===== PIAZZALE + CONTAINER ===== -->
  <text x="330" y="166" font-size="15" font-weight="bold">PIAZZALE — container accatastati</text>
  <g fill="#d6cbae" stroke="#1a2733" stroke-width="2">
    <rect x="330" y="190" width="110" height="34"/>
    <rect x="330" y="236" width="110" height="34"/>
    <rect x="330" y="282" width="110" height="34"/>
    <rect x="466" y="190" width="110" height="34"/>
    <rect x="466" y="244" width="110" height="34" transform="rotate(4 521 261)"/>
    <rect x="620" y="176" width="110" height="34"/>
    <rect x="330" y="640" width="110" height="34"/>
    <rect x="330" y="686" width="110" height="34" transform="rotate(-4 385 703)"/>
  </g>

  <!-- ===== UFFICI (porte e finestre) ===== -->
  <g transform="translate(340,770)">
    <rect x="0" y="0" width="190" height="150" fill="#e9e1cb" stroke="#1a2733" stroke-width="3.5"/>
    <!-- porta principale (lato nord, verso il piazzale) con arco -->
    <g stroke="#1a2733" stroke-width="2.5" fill="none">
      <path d="M86 0 h34"/>
      <path d="M86 0 A 34 34 0 0 1 120 -34" stroke-width="1.4"/>
      <line x1="86" y1="0" x2="86" y2="-34"/>
    </g>
    <!-- porta secondaria lato est -->
    <g stroke="#1a2733" stroke-width="2.5" fill="none">
      <path d="M190 96 v28"/>
      <path d="M190 96 A 28 28 0 0 1 218 124" stroke-width="1.4"/>
      <line x1="190" y1="96" x2="218" y2="96"/>
    </g>
    <!-- finestre (doppio trattino) -->
    <g stroke="#1a2733" stroke-width="5">
      <path d="M20 -2 h30 M140 -2 h30"/>
      <path d="M20 152 h30 M80 152 h30 M140 152 h30"/>
      <path d="M-2 30 v30 M-2 90 v30"/>
    </g>
    <g stroke="#f6f1e4" stroke-width="1.6">
      <path d="M20 -2 h30 M140 -2 h30"/>
      <path d="M20 152 h30 M80 152 h30 M140 152 h30"/>
      <path d="M-2 30 v30 M-2 90 v30"/>
    </g>
    <line x1="0" y1="76" x2="190" y2="76" stroke="#1a2733" stroke-width="1.4"/>
    <text x="14" y="30" font-size="16" font-weight="bold">UFFICI 事務所</text>
    <text x="14" y="52" font-size="13">due piani + scala interna</text>
    <text x="14" y="112" font-size="13">finestre su tre lati,</text>
    <text x="14" y="130" font-size="13">porte a nord e a est</text>
  </g>

  <!-- ===== CAPANNONE ===== -->
  <g transform="translate(560,230)">
    <!-- muri -->
    <rect x="0" y="0" width="560" height="600" fill="#efe7d2" stroke="#1a2733" stroke-width="5"/>
    <rect x="0" y="0" width="560" height="600" fill="url(#hatch)" opacity="0.15"/>
    <text x="150" y="38" font-size="22" font-weight="bold" letter-spacing="2">CAPANNONE — h 15 m</text>
    <text x="150" y="60" font-size="13">lucernari sul tetto: luce a lame, ombra fitta</text>

    <!-- FRONTE OVEST: TRE GRANDI APERTURE (ingresso principale) -->
    <g>
      <rect x="-8" y="90" width="16" height="120" fill="#f6f1e4"/>
      <rect x="-8" y="250" width="16" height="120" fill="#f6f1e4"/>
      <rect x="-8" y="410" width="16" height="120" fill="#f6f1e4"/>
      <!-- ante scorrevoli accostate -->
      <g stroke="#1a2733" stroke-width="4">
        <path d="M-18 86 v58 M10 156 v58"/>
        <path d="M-18 246 v58 M10 316 v58"/>
        <path d="M-18 406 v58 M10 476 v58"/>
      </g>
    </g>
    <text x="-500" y="432" font-size="15" font-weight="bold">INGRESSO PRINCIPALE</text>
    <text x="-500" y="452" font-size="13">tre aperture da 12 m</text>
    <text x="-500" y="470" font-size="13">(ante scorrevoli in lamiera)</text>
    <line x1="-310" y1="448" x2="-10" y2="330" stroke="#1a2733" stroke-width="1.2"/>

    <!-- portone EST verso banchina -->
    <rect x="555" y="250" width="10" height="120" fill="#f6f1e4"/>
    <g stroke="#1a2733" stroke-width="3"><path d="M554 250 v50 M574 320 v50"/></g>
    <text x="210" y="590" font-size="12">portone EST → banchina (carichi via chiatta)</text>

    <!-- soppalco lungo il muro nord -->
    <rect x="12" y="70" width="536" height="52" fill="none" stroke="#1a2733" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="20" y="103" font-size="13">SOPPALCO in grigliato (muro nord) — scala unica a est ↗</text>
    <g stroke="#1a2733" stroke-width="2"><path d="M530 122 v40 M522 130 h16 M522 140 h16 M522 150 h16"/></g>

    <!-- quadro elettrico -->
    <rect x="14" y="540" width="26" height="36" fill="#e9e1cb" stroke="#1a2733" stroke-width="2.5"/>
    <text x="48" y="556" font-size="13">quadro elettrico ⚡</text>
    <text x="48" y="573" font-size="12">(generale del capannone)</text>

    <!-- casse e fusti -->
    <g fill="#d6cbae" stroke="#1a2733" stroke-width="1.6">
      <rect x="90" y="170" width="58" height="30"/>
      <rect x="90" y="208" width="58" height="30"/>
      <rect x="190" y="186" width="58" height="30" transform="rotate(7 219 201)"/>
      <rect x="300" y="170" width="58" height="30"/>
      <rect x="120" y="320" width="58" height="30"/>
      <rect x="210" y="340" width="58" height="30"/>
      <circle cx="330" cy="345" r="12"/><circle cx="357" cy="345" r="12"/><circle cx="344" cy="367" r="12"/>
    </g>
    <text x="90" y="162" font-size="12">casse e fusti</text>

    <!-- semirimorchio telonato in fondo -->
    <g transform="translate(330,455)">
      <rect x="0" y="0" width="185" height="56" rx="7" fill="#c9bfa0" stroke="#1a2733" stroke-width="3"/>
      <rect x="0" y="0" width="185" height="56" rx="7" fill="url(#hatch2)" opacity=".5"/>
      <circle cx="28" cy="61" r="10" fill="#1a2733"/><circle cx="54" cy="61" r="10" fill="#1a2733"/><circle cx="155" cy="61" r="10" fill="#1a2733"/>
      <text x="12" y="-12" font-size="14" font-weight="bold">semirimorchio telonato</text>
    </g>
  </g>

  <!-- ===== NORD + SCALA ===== -->
  <g transform="translate(88,200)">
    <path d="M0 52 L0 -8 M0 -8 L-12 14 M0 -8 L12 14" stroke="#1a2733" stroke-width="4.5" fill="none"/>
    <text x="-10" y="-20" font-size="28" font-weight="bold">N</text>
  </g>
  <g transform="translate(60,930)">
    <text x="0" y="-9" font-size="14">0      10 m     20 m               40 m</text>
    <rect x="0" y="0" width="60" height="9" fill="#1a2733"/>
    <rect x="60" y="0" width="60" height="9" fill="none" stroke="#1a2733" stroke-width="1.6"/>
    <rect x="120" y="0" width="120" height="9" fill="#1a2733"/>
  </g>

  <!-- legenda simboli -->
  <g transform="translate(64,772)">
    <rect x="-12" y="-26" width="216" height="132" fill="#f6f1e4" stroke="#1a2733" stroke-width="1.6"/>
    <text x="0" y="-6" font-size="14" font-weight="bold">LEGENDA</text>
    <g stroke="#1a2733" stroke-width="2.5" fill="none"><path d="M0 14 h26"/><path d="M0 14 A 26 26 0 0 1 26 -12" stroke-width="1.2"/></g>
    <text x="40" y="20" font-size="13">porta</text>
    <g stroke="#1a2733" stroke-width="5"><path d="M0 40 h26"/></g>
    <g stroke="#f6f1e4" stroke-width="1.6"><path d="M0 40 h26"/></g>
    <text x="40" y="45" font-size="13">finestra</text>
    <circle cx="13" cy="66" r="6" fill="#1a2733"/>
    <text x="40" y="71" font-size="13">bitta d'ormeggio</text>
    <g stroke="#1a2733" stroke-width="2" stroke-dasharray="8 5"><path d="M0 92 h26"/></g>
    <text x="40" y="97" font-size="13">soppalco / binari</text>
  </g>
</svg>
</div>

</body>
</html>
